name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    name: Compilar APK Capacitor
    runs-on: ubuntu-latest

    # Todos los comandos se ejecutarán dentro de la carpeta CandyCrush
    defaults:
      run:
        working-directory: ./CandyCrush

    steps:
      # 1. Descarga el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura Node.js (necesario para compilar la app web)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Usa la versión de Node que requiera tu proyecto
          cache: 'npm'
          cache-dependency-path: ./CandyCrush/package-lock.json

      # 3. Configura Java 17 (necesario para compilar Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Instala las dependencias de Node
      - name: Install npm dependencies
        run: npm ci

      # 5. Compila la aplicación web (Vite, React, Vue, etc.)
      # ⚠️ Asegúrate de que "npm run build" sea el comando correcto en tu package.json
      - name: Build Web App
        run: npm run build

      # 6. Sincroniza los archivos web compilados con el proyecto Android
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 7. Otorga permisos de ejecución al script gradlew dentro de la carpeta android
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 8. Compila el APK de depuración
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      # 9. Sube el APK como artefacto para descargarlo
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          # Nota: La ruta es relativa a la raíz del repositorio, no a la carpeta CandyCrush
          path: ./CandyCrush/android/app/build/outputs/apk/debug/app-debug.apk